name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: pytest
        # No display on the runner, and the suite builds real widgets.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests -q

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Build exe
        env:
          QT_QPA_PLATFORM: offscreen
        run: pyinstaller build/lumina.spec --clean --noconfirm --distpath build/output/dist --workpath build/output/work

      - uses: actions/upload-artifact@v4
        with:
          name: lumina-unpackaged
          path: build/output/dist/LUMINA
          retention-days: 7
