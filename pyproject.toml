[project]
name = "lumina"
version = "2.0.1"
description = "Windows brightness control for internal panels and DDC/CI monitors"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.9",
    "pywin32>=306",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.16", "pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
